; PlatformIO Project Configuration File
;
; M5Stack Core2 オーディオスペクトラムアナライザー
; 内蔵PDMマイク(SPM1423) -> I2S(M5Unified Mic) -> FFT(arduinoFFT) -> LCD表示

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
	m5stack/M5Unified@^0.2.27
	kosme/arduinoFFT@^2.0.4
